version: "3.9"

services:
  server:
    build: ./server
    container_name: server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    networks:
      - fullstack-net

  client:
    build:
      context: ./client
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
    container_name: client
    ports:
      - "5173:3000"
    env_file:
      - ./client/.env
    depends_on:
      - server
    networks:
      - fullstack-net

networks:
  fullstack-net:
    driver: bridge